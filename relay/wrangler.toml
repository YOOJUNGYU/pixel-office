name = "pixel-office-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# Free plan: SQLite-backed Durable Objects only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Optional overrides (defaults = DEFAULT_LIMITS in src/hub.ts). ADMIN_TOKEN is a secret:
# `npx wrangler secret put ADMIN_TOKEN`, locally `.dev.vars` (gitignored).
# [vars]
# MAX_PEERS = 20
# DAILY_BUDGET = 1900000
# MAX_FRAMES_PER_MIN = 120
# ABUSE_BAN_MIN = 60
# KICK_HOURS = 24
